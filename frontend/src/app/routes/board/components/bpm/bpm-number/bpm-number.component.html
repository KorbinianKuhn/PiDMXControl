<div class="flex flex-col cursor-pointer">
  <div
    class="h-8 bg-gray-900 flex justify-center items-center text-xl rounded-md"
  >
    {{ bpm() }}
  </div>
  <div class="flex mt-1">
    @for (bar of bars(); track $index; let last = $last) {
      <div
        [class.mr-2]="!last"
        [class]="bar ? 'bg-cyan-800' : 'bg-gray-900'"
        class="w-5 h-3 rounded-xs"
      ></div>
    }
  </div>
</div>
