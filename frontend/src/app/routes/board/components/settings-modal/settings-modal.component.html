<mat-tab-group class="h-screen">
  <mat-tab label="Actions">
    <ng-template matTabContent>
      <div class="flex">
        <app-pad-button
          color="bg-cyan-400"
          [active]="testChannelMode()"
          (click)="onToggleTestChannelMode()"
          class="m-2"
          >Channel Tester</app-pad-button
        >

        <app-pad-button
          color="bg-red-400"
          [active]="false"
          class="m-2"
          (click)="onClickRecreateChases()"
          >Recreate chases</app-pad-button
        >
      </div>
    </ng-template>
  </mat-tab>
  <mat-tab label="Settings">
    <ng-template matTabContent>
      <app-device-config-list></app-device-config-list>
    </ng-template>
  </mat-tab>
  <mat-tab label="Test channels">
    <ng-template matTabContent>
      <app-test-channel-device-list></app-test-channel-device-list>
    </ng-template>
  </mat-tab>
</mat-tab-group>
