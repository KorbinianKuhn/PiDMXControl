<div class="container" tabindex="0">
  <app-panel-group label="Global">
    <table>
      <tr>
        <td>Brightness</td>
        <td>
          <mat-slider [min]="0" [max]="1" [step]="0.05" discrete>
            <input
              matSliderThumb
              [value]="master()"
              (valueChange)="onMasterChange($event)"
            />
          </mat-slider>
        </td>
        <td>{{ master() | percent }}</td>
      </tr>
      <tr>
        <td>Ambient UV</td>
        <td>
          <mat-slider [min]="0" [max]="255" [step]="1" discrete>
            <input
              matSliderThumb
              [value]="ambientUV()"
              (valueChange)="onAmbientUVChange($event)"
            />
          </mat-slider>
        </td>
        <td>{{ ambientUV() | percent }}</td>
      </tr>
      @for (control of controls(); track control.id) {
        <tr>
          <td>{{ control.id }}</td>
          <td [class.opacity-50]="control.disabled">
            <mat-slider [min]="0" [max]="1" [step]="0.05" discrete>
              <input
                matSliderThumb
                [value]="control.value"
                (dragEnd)="onSliderChange(control, $event)"
              />
            </mat-slider>
          </td>
          <td>{{ control.value | percent }}</td>
          <td>
            <mat-slide-toggle
              [checked]="control.disabled"
              (change)="onToggleChange(control, $event)"
              >Disable</mat-slide-toggle
            >
          </td>
        </tr>
      }
    </table>
  </app-panel-group>
</div>
