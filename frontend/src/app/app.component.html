<div class="container flex min-h-full min-w-full justify-center items-center">
  <router-outlet />
</div>

@if (!wsConnected()) {
  <div class="overlay">
    <span>Waiting for connection...</span>
    <button mat-icon-button (click)="onRefreshClick()">
      <mat-icon svgIcon="refresh" />
    </button>
  </div>
}
