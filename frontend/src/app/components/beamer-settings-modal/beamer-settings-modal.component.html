<div class="flex flex-wrap">
  <app-panel-group label="Source">
    <mat-radio-group
      [value]="visuals().currentIndex"
      (change)="onVisualIndexChange($event)"
      class="flex flex-col"
    >
      <mat-radio-button [value]="-1" color="primary">None</mat-radio-button>
      @for (source of visuals().sources; track $index; let index = $index) {
        <mat-radio-button [value]="index" color="primary">{{
          source.url.replace(".mp4", "").replaceAll("-", " ") | titlecase
        }}</mat-radio-button>
      }
    </mat-radio-group>
  </app-panel-group>
  <app-panel-group label="Options">
    <div class="flex flex-col">
      <mat-checkbox
        [checked]="visuals().color === 'chase'"
        (change)="onToggleColor()"
        color="primary"
        >Chase Color</mat-checkbox
      >
      <mat-checkbox
        [checked]="visuals().opacity === 'chase'"
        (change)="onToggleOpacity()"
        color="primary"
        >Chase Opacity</mat-checkbox
      >
      <mat-checkbox
        [checked]="visuals().text"
        (change)="onToggleText()"
        color="primary"
        >Show Text</mat-checkbox
      >
    </div>
  </app-panel-group>
</div>
