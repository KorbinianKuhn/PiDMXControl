services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: dmx-mosquitto
    restart: always
    hostname: mosquitto
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - 1883:1883
      - 8883:8883

  backend:
    build:
      context: ./backend
    container_name: dmx-backend
    restart: always
    environment:
      - BASE_URL=http://localhost:3000
      - SEND_DATA=true
      - UART_SERIAL=false
      - MQTT_HOST=mqtt://mosquitto:1883
      - STATIC_DIRECTORY=/usr/src/app/static
    volumes:
      - ./static:/usr/src/app/static
    depends_on:
      - mosquitto
    ports:
      - 3000:3000

  frontend:
    build:
      context: ./frontend
    container_name: dmx-frontend
    restart: always
    environment:
      - BASE_REST_API=http://localhost:3000
      - MQTT_WS_URL=ws://localhost:8883
    ports:
      - 80:80
